description: 'Kishlay Foods is a snack-food manufacturing company based in Guwahati,
  Assam, India, operating since 2003. The company produces premium potato chips, namkeens,
  and traditional Indian savory snacks, with regional varieties such as Aloo Bhujia,
  Bengali Mix, Chakna Mix, Cocktail Peanut, and Chana Jor Garam. Kishlay Foods runs
  a consumer/distributor marketing website and recruits distributor partners across
  the region; it publishes no public developer API, SDK, webhook, or developer-portal
  surface. This profile was surfaced as a portfolio company of Norwest Venture Partners
  and added to the API Evangelist network for enrichment.'
